name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: the action defaults to `tools platform-tools`, but the
          # obsolete `tools` package no longer exists and fails the step, so
          # the exact packages this build needs are listed explicitly.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Build (assemble, lint, unit tests)
        run: ./gradlew build --stacktrace

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lookup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
